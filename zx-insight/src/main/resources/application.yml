server:
  port: 8095

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: insight-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/zx_insight?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      discovery:
        # 关闭 Nacos 时靠各服务下方的 static simple.instances 直连；生产置 NACOS_ENABLED=true 并指向注册中心
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
    # 本地直连：关闭 Nacos 后，通过 SimpleDiscoveryClient 提供静态服务地址（生产环境启用 Nacos 后删除此段）
    discovery:
      client:
        simple:
          instances:
            learning-service:
              - uri: ${SVC_LEARNING_URI:http://localhost:8086}
            exam-service:
              - uri: ${SVC_EXAM_URI:http://localhost:8084}
            course-service:
              - uri: ${SVC_COURSE_URI:http://localhost:8083}
            user-service:
              - uri: ${SVC_USER_URI:http://localhost:8082}
            trade-service:
              - uri: ${SVC_TRADE_URI:http://localhost:8087}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

zx:
  llm:
    enabled: ${ZX_LLM_ENABLED:false}
    base-url: ${ZX_LLM_BASE_URL:https://api.openai.com}
    api-key: ${ZX_LLM_API_KEY:}
    model: ${ZX_LLM_MODEL:gpt-3.5-turbo}
    # 学情报告分析阈值
    insight:
      weak-accuracy: 60
      weak-progress: 40
      recommend-limit: 3
