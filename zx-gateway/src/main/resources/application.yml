server:
  port: 8080

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: false
      config:
        enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"
      routes:
        # 秒杀领取限流路由（须位于 promotion-service 之前，仅拦截 POST 领取，轮询不受影响）
        - id: seckill-claim
          uri: http://localhost:8088
          predicates:
            - Path=/user-coupons/seckill/*
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@seckillKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        # 生产环境推荐使用 lb://service-name（需启用 Nacos），本地直连开发
        # 认证服务
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/accounts/**,/menus/**,/roles/**,/privileges/**,/jwks/**
        # 用户服务
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**,/students/**,/teachers/**,/staffs/**
        # 课程服务
        - id: course-service
          uri: http://localhost:8083
          predicates:
            - Path=/courses/**,/categorys/**,/catalogues/**,/course/**
        # 考试服务
        - id: exam-service
          uri: http://localhost:8084
          predicates:
            - Path=/questions/**,/question-biz/**,/question-results/**
        # 媒资服务
        - id: media-service
          uri: http://localhost:8085
          predicates:
            - Path=/files/**,/medias/**
        # 学习服务
        - id: learning-service
          uri: http://localhost:8086
          predicates:
            - Path=/lessons/**,/learning-records/**,/replies/**,/notes/**,/points/**,/boards/**,/sign-records/**,/admin/**
        # 交易服务
        - id: trade-service
          uri: http://localhost:8087
          predicates:
            - Path=/carts/**,/orders/**,/order-details/**,/refund-apply/**,/pay/**
        # 营销服务
        - id: promotion-service
          uri: http://localhost:8088
          predicates:
            - Path=/coupons/**,/user-coupons/**,/codes/**
        # 支付服务
        - id: pay-service
          uri: http://localhost:8090
          predicates:
            - Path=/pay-channels/**,/pay-orders/**,/refund-orders/**,/notify/**
        # 搜索服务
        - id: search-service
          uri: http://localhost:8091
          predicates:
            - Path=/interests/**,/recommend/**
        # 点赞服务
        - id: remark-service
          uri: http://localhost:8092
          predicates:
            - Path=/likes/**
        # 消息服务
        - id: message-service
          uri: http://localhost:8093
          predicates:
            - Path=/message-templates/**,/notice-tasks/**,/notice-templates/**,/sms/**,/sms-platforms/**,/inboxes/**
        # AI 服务
        - id: aigc-service
          uri: http://localhost:8089
          predicates:
            - Path=/chat/**,/session/**,/audio/**,/embedding/**
        # 数据看板服务
        - id: data-service
          uri: http://localhost:8094
          predicates:
            - Path=/data/**
        # 智能学情分析服务
        - id: insight-service
          uri: http://localhost:8095
          predicates:
            - Path=/insight/**

zx:
  jwt:
    secret: ${ZX_JWT_SECRET}
