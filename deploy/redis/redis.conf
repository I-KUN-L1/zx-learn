# ============================================================
# 知行智学（zx-learn）Redis 部署配置（Redis 7）
# 由 docker-compose 挂载覆盖 /usr/local/etc/redis/redis.conf
# 密码不写死于此：通过 docker-compose 的命令参数 --requirepass ${REDIS_PASSWORD} 注入
# ============================================================

# ---------- 网络与安全 ----------
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---------- 进程 ----------
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# ---------- 数据库 ----------
databases 16

# ---------- RDB 持久化 ----------
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ---------- AOF 持久化（下单/核销场景，AOF 保证几乎不丢） ----------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
aof-rewrite-incremental-fsync yes
aof-load-truncated yes

# ---------- 内存策略 ----------
# 优惠券库存(扣减/恢复)与幂等 keys 不允许被淘汰，丢失会造成超卖/重复消费，
# 因此这里用 noeviction：内存满时写入报错而非驱逐数据，配合监控告警扩容
maxmemory 256mb
maxmemory-policy noeviction
maxmemory-samples 5
lazyfree-lazy-eviction yes

# ---------- 慢查询与观测 ----------
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 0