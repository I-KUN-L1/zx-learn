# ============================================================
# 知行智学 zx-web 前端站点 + 网关反向代理（Nginx）
#
# 为什么必须有这个文件（上线审查发现的关键缺口）：
#   前端生产构建（zx-web/.env.production）使用 VITE_API_BASE_URL=/api，
#   所有请求形如 /api/courses/page；而网关（zx-gateway）的路由断言**不含 /api 前缀**
#   （真实路径是 /courses/page）。开发态由 vite 的 devServer.proxy 用
#   `rewrite: path => path.replace(/^\/api/,'')` 剥掉前缀，生产态却没有对应的反代配置，
#   ⇒ 部署后前端所有接口会 404。本文件就是生产态的等价物：
#      location /api/ { proxy_pass http://zx-gateway:8080/; }   ← 末尾斜杠即"剥离 /api 前缀"
#
# 放置位置（容器）：/etc/nginx/conf.d/default.conf
# 手工部署时同步修改 server_name / proxy_pass 指向。
# ============================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 32m;          # 讲义/图片上传

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 后端接口：转发到网关并剥离 /api 前缀 ----------
    location /api/ {
        # 末尾的 "/" 会把 /api/xxx 重写为 /xxx —— 网关不认识 /api 前缀
        proxy_pass http://zx-gateway:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # AI 助教 /chat 走 SSE 流式输出：必须关闭缓冲，否则前端收不到逐字推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 静态资源：带内容哈希的构建产物长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/(covers|banners)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- SPA 前端路由：未命中文件一律回落 index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";     # index.html 不缓存，便于发版即可生效
    }

    # ---------- 健康探测（供容器 healthcheck / LB 使用）----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
