server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: promotion-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zx_promotion?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: false
      config:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ------------------- RocketMQ（秒杀领取异步落库；name-server 触发 zx-common 自动装配） -------------------
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer-group: promotion-producer
  consumer-group: promotion-consumer

zx:
  seckill:
    # 每人限领数量（Lua 内原子判断）
    claim-limit: 1
    # 对账任务开关与周期（毫秒）
    reconcile-enabled: true
    reconcile-delay: 60000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0