server:
  port: 8080

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        # 关闭 Nacos 时靠各服务下方的 static simple.instances 直连；生产置 NACOS_ENABLED=true 并指向注册中心
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
    gateway:
      httpclient:
        # 连接超时 2s：下游服务未监听/网络不可达时快速失败
        connect-timeout: 2000
        # 响应超时 30s：普通 JSON 接口的兜底阈值（SSE 流式路由单独放宽，见 aigc-service metadata）
        response-timeout: 30s
        pool:
          type: elastic
      globalcors:
        cors-configurations:
          '[/**]':
            # 明确允许的前端来源（开发态）；生产同源部署无需跨域，
            # 生产通过 CORS_ALLOWED_ORIGINS 覆盖（逗号分隔多个来源，
            # 例：CORS_ALLOWED_ORIGINS=https://learn.example.com,https://admin.example.com）。
            #
            # ⚠ 必须同时覆盖 localhost 与 127.0.0.1，且端口用 [*] 通配 —— 否则会出现
            #   「页面打得开、一操作就失败」的隐蔽故障：
            #   浏览器对同源 GET 不发送 Origin，但同源 POST/PUT/DELETE 一律携带 Origin。
            #   若白名单只有 http://localhost:5173，当用户以 http://127.0.0.1:5173 打开前端时，
            #   页面浏览（GET）正常，而所有写操作（AI 助教发消息、新建会话、加购、下单、
            #   提交答题、改资料…）都会被 CORS 判定为非法来源，返回 403 Forbidden
            #   （空响应体 + Vary: Origin），前端只能看到「连接中断，请重试」，极难定位。
            #   端口通配则避免 dev server 换端口（5173/5174/自动递增）后再次漏配。
            # 不使用 "*"：本项与 allow-credentials=true 组合时浏览器会拒绝，且等于放弃跨域控制。
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
            allowed-methods: "*"
            allowed-headers: "*"
            # 前端 axios withCredentials=true，需允许凭据
            allow-credentials: true
      routes:
        # 秒杀领取限流路由（须位于 promotion-service 之前，仅拦截 POST 领取，轮询不受影响）
        - id: seckill-claim
          uri: ${GW_PROMOTION_URI:http://localhost:8088}
          predicates:
            - Path=/user-coupons/seckill/*
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@seckillKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        # 生产环境推荐使用 lb://service-name（需启用 Nacos），本地直连开发
        # 认证服务
        - id: auth-service
          uri: ${GW_AUTH_URI:http://localhost:8081}
          predicates:
            - Path=/accounts/**,/menus/**,/roles/**,/privileges/**,/jwks/**
        # 用户服务
        - id: user-service
          uri: ${GW_USER_URI:http://localhost:8082}
          predicates:
            - Path=/users/**,/students/**,/teachers/**,/staffs/**
        # 搜索服务的课程检索端点（须置于 course-service 之前，避免被 /courses/** 通配遮蔽）
        - id: search-course-route
          uri: ${GW_SEARCH_URI:http://localhost:8091}
          predicates:
            - Path=/courses/portal,/courses/name
        # 课程服务
        - id: course-service
          uri: ${GW_COURSE_URI:http://localhost:8083}
          predicates:
            - Path=/courses/**,/categorys/**,/catalogues/**,/course/**
        # 考试服务
        - id: exam-service
          uri: ${GW_EXAM_URI:http://localhost:8084}
          predicates:
            - Path=/questions/**,/question-biz/**,/question-results/**
        # 媒资服务
        - id: media-service
          uri: ${GW_MEDIA_URI:http://localhost:8085}
          predicates:
            - Path=/files/**,/medias/**
        # 学习服务
        # 注意：predicates 里**不要**放 /admin/** —— 该通配会抢走 zx-aigc 的
        # /admin/knowledge/**（本路由排在 aigc-service 之前），导致知识库上传/检索经网关 404。
        # 学习服务本身没有任何 /admin 端点。
        - id: learning-service
          uri: ${GW_LEARNING_URI:http://localhost:8086}
          predicates:
            - Path=/lessons/**,/learning-records/**,/replies/**,/notes/**,/points/**,/boards/**,/sign-ins/**,/sign-records/**
        # 交易服务
        - id: trade-service
          uri: ${GW_TRADE_URI:http://localhost:8087}
          predicates:
            - Path=/carts/**,/orders/**,/order-details/**,/refund-apply/**,/pay/**
        # 营销服务
        - id: promotion-service
          uri: ${GW_PROMOTION_URI:http://localhost:8088}
          predicates:
            - Path=/coupons/**,/user-coupons/**,/codes/**
        # 支付服务
        - id: pay-service
          uri: ${GW_PAY_URI:http://localhost:8090}
          predicates:
            - Path=/pay-channels/**,/pay-orders/**,/refund-orders/**,/notify/**
        # 搜索服务
        - id: search-service
          uri: ${GW_SEARCH_URI:http://localhost:8091}
          predicates:
            - Path=/interests/**,/recommend/**
        # 点赞服务
        - id: remark-service
          uri: ${GW_REMARK_URI:http://localhost:8092}
          predicates:
            - Path=/likes/**
        # 消息服务
        - id: message-service
          uri: ${GW_MESSAGE_URI:http://localhost:8093}
          predicates:
            - Path=/message-templates/**,/notice-tasks/**,/notice-templates/**,/sms/**,/sms-platforms/**,/inboxes/**
        # AI 服务（SSE 流式对话：响应为长连接，覆盖全局 30s 响应超时为 15 分钟）
        # /admin/knowledge/** 为 RAG 知识库管理端点（zx-aigc KnowledgeController），
        # 必须显式声明，否则不会被任何路由命中（learning-service 的 /admin/** 已移除）。
        - id: aigc-service
          uri: ${GW_AIGC_URI:http://localhost:8089}
          predicates:
            - Path=/chat/**,/session/**,/audio/**,/embedding/**,/admin/knowledge/**
          metadata:
            response-timeout: 900000
        # 数据看板服务
        - id: data-service
          uri: ${GW_DATA_URI:http://localhost:8094}
          predicates:
            - Path=/data/**
        # 智能学情分析服务
        - id: insight-service
          uri: ${GW_INSIGHT_URI:http://localhost:8095}
          predicates:
            - Path=/insight/**

zx:
  jwt:
    secret: ${ZX_JWT_SECRET}
